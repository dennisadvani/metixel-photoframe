name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  quality:
    name: Quality gates (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r requirements-ci.txt

      - name: Lint (ruff check)
        run: ruff check src/metixel/ testing/

      - name: Format (ruff format)
        run: ruff format --check src/metixel/ testing/

      - name: Type check (mypy)
        # Both trees.  The tests are type-checked too so the Protocol fakes
        # (IPCSender, HttpGateway, ...) cannot silently drift away from the
        # real interfaces they stand in for.
        run: mypy src/metixel/ testing/

      - name: Tests (pytest)
        run: pytest testing/unit_tests/ -q --no-cov
