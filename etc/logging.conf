[loggers]
keys=root,metixel

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=defaultFormatter

[logger_root]
level=INFO
handlers=consoleHandler,fileHandler

[logger_metixel]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=metixel
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=defaultFormatter
args=(sys.stdout,)

[handler_fileHandler]
# NOTE: The level set here is a *fallback default*.  At startup the
# persisted value from config.json → system.log_level is applied to
# all FileHandlers (see metixel/__main__.py:_setup_logging).  The
# web UI (Advanced → System → File Log Level) changes it at runtime.
class=handlers.RotatingFileHandler
level=DEBUG
formatter=defaultFormatter
args=('/opt/metixel/data/logs/metixel.log', 'a', 10485760, 5)

[formatter_defaultFormatter]
format=%(asctime)s [%(levelname)s] %(name)s: %(message)s
datefmt=%Y-%m-%d %H:%M:%S
