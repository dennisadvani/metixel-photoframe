<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#8B1A2B">
    <title>Metixel — WiFi Setup</title>
    <style>
        :root {
            --bg: #0d0d12;
            --card-bg: #18181f;
            --primary: #8B1A2B;
            --primary-hover: #a01e32;
            --text: #e8e8ed;
            --text-muted: #909099;
            --border: #2a2a35;
            --success: #2ecc71;
            --danger: #e74c3c;
            --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
        }
        .logo {
            margin: 32px 0 8px;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 0.92rem;
            margin-bottom: 28px;
            text-align: center;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            width: 100%;
            max-width: 420px;
        }
        .card h2 {
            font-size: 1.15rem;
            margin-bottom: 16px;
            font-weight: 600;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
            width: 100%;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn--primary { background: var(--primary); color: #fff; }
        .btn--primary:hover:not(:disabled) { background: var(--primary-hover); }
        .btn--secondary { background: var(--border); color: var(--text); margin-top: 8px; }

        .network-list { margin: 12px 0; }
        .network-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .network-item:hover { background: rgba(255,255,255,0.04); }
        .network-item.selected { border-color: var(--primary); background: rgba(139,26,43,0.1); }
        .network-signal {
            width: 24px;
            height: 24px;
            margin-right: 12px;
            flex-shrink: 0;
            display: flex;
            align-items: flex-end;
            gap: 2px;
        }
        .signal-bar {
            width: 4px;
            background: var(--text-muted);
            border-radius: 1px;
        }
        .signal-1 { height: 5px; }
        .signal-2 { height: 10px; }
        .signal-3 { height: 15px; }
        .signal-4 { height: 20px; }
        .network-item.selected .signal-bar { background: var(--primary); }
        .network-name {
            flex: 1;
            font-weight: 500;
            font-size: 0.95rem;
        }
        .network-lock {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-left: 8px;
        }
        .form-group { margin: 16px 0; }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .status-msg {
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.88rem;
            display: none;
        }
        .status-msg.success { display: block; background: rgba(46,204,113,0.15); color: var(--success); }
        .status-msg.error { display: block; background: rgba(231,76,60,0.15); color: var(--danger); }
        .status-msg.loading { display: block; background: rgba(255,255,255,0.05); color: var(--text-muted); }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--text-muted);
            border-top-color: var(--text);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .manual-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.82rem;
            color: var(--text-muted);
        }
        .manual-link a { color: var(--primary); }
    </style>
</head>
<body>
    <div class="logo">📷 Metixel</div>
    <p class="subtitle">WiFi Setup</p>

    <!-- Step 0: PIN entry (security gate) -->
    <div class="card" id="step-pin">
        <h2>Security Check</h2>
        <p style="color:var(--text-muted);font-size:0.88rem;margin-bottom:12px">
            Enter the 4-digit code shown on your Metixel frame display.
        </p>
        <div class="form-group">
            <input type="text" id="pin-input" placeholder="0000" maxlength="4" inputmode="numeric" pattern="[0-9]*" autocomplete="off" style="text-align:center;font-size:1.8rem;letter-spacing:0.3em">
        </div>
        <button class="btn btn--primary" id="btn-pin" onclick="doValidatePin()">Verify</button>
        <div id="pin-status" class="status-msg"></div>
    </div>

    <!-- Step 1: Scan -->
    <div class="card" id="step-scan" style="display:none">
        <h2>Connect to WiFi</h2>
        <p style="color:var(--text-muted);font-size:0.88rem;margin-bottom:12px">
            Select your network to get started.
        </p>
        <button class="btn btn--primary" id="btn-scan" onclick="doScan()">
            <span class="material-icons">wifi_find</span> Scan for Networks
        </button>
        <div class="network-list" id="network-list"></div>
        <div id="scan-status" class="status-msg"></div>
    </div>

    <!-- Step 2: Enter password -->
    <div class="card" id="step-connect" style="display:none">
        <h2 id="connect-title">Connect to …</h2>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password-input" placeholder="Enter WiFi password" autocomplete="off">
        </div>
        <div style="display:flex;gap:8px">
            <button class="btn btn--secondary" onclick="goBack()" style="flex:1">Back</button>
            <button class="btn btn--primary" id="btn-connect" onclick="doConnect()" style="flex:2">Connect</button>
        </div>
        <div id="connect-status" class="status-msg"></div>
    </div>

    <!-- Step 3: Success -->
    <div class="card" id="step-done" style="display:none;text-align:center">
        <h2 style="color:var(--success)">✓ Connected!</h2>
        <p style="margin:12px 0;color:var(--text-muted)">
            Your Metixel frame is now online.
        </p>
        <p style="font-size:0.9rem">
            Find the dashboard at:<br>
            <strong id="done-ip">http://metixel.local</strong>
        </p>
    </div>

    <p class="manual-link">
        Already set up? <a href="/">Go to Dashboard</a>
    </p>

    <script>
        var selectedSSID = "";
        var selectedSecurity = "";
        var pinValidated = false;

        // Enter key submits PIN
        document.getElementById("pin-input").addEventListener("keydown", function(e) {
            if (e.key === "Enter") doValidatePin();
        });

        // Enter key submits password
        document.getElementById("password-input").addEventListener("keydown", function(e) {
            if (e.key === "Enter") doConnect();
        });

        // ── Check if PIN is required on page load ──────────────────
        (async function init() {
            try {
                var resp = await fetch("/api/network/status");
                var data = await resp.json();
                if (!data.require_pin) {
                    // No PIN active — skip to scan (shouldn't happen in AP mode,
                    // but handle gracefully)
                    pinValidated = true;
                    document.getElementById("step-pin").style.display = "none";
                    document.getElementById("step-scan").style.display = "";
                }
            } catch (e) {
                // Can't reach API — show PIN screen as safe default
            }
        })();

        // ── PIN validation ─────────────────────────────────────────
        async function doValidatePin() {
            var btn = document.getElementById("btn-pin");
            var status = document.getElementById("pin-status");
            var input = document.getElementById("pin-input");
            var pin = input.value.trim();

            if (pin.length !== 4 || !/^\d{4}$/.test(pin)) {
                status.className = "status-msg error";
                status.textContent = "Enter a 4-digit PIN";
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Checking…';
            status.className = "status-msg loading";
            status.textContent = "";

            try {
                var resp = await fetch("/api/network/validate-pin", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ pin: pin })
                });
                var data = await resp.json();

                if (data.valid) {
                    pinValidated = true;
                    status.className = "";
                    document.getElementById("step-pin").style.display = "none";
                    document.getElementById("step-scan").style.display = "";
                } else {
                    status.className = "status-msg error";
                    status.textContent = data.message || "Incorrect PIN";
                    btn.disabled = false;
                    btn.textContent = "Verify";
                    input.value = "";
                    input.focus();
                }
            } catch (e) {
                status.className = "status-msg error";
                status.textContent = "Validation failed — please try again";
                btn.disabled = false;
                btn.textContent = "Verify";
            }
        }

        async function doScan() {
            var btn = document.getElementById("btn-scan");
            var status = document.getElementById("scan-status");
            var list = document.getElementById("network-list");

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Scanning…';
            status.className = "status-msg loading";
            status.textContent = "Scanning for networks…";
            list.innerHTML = "";

            try {
                var resp = await fetch("/api/network/scan");
                var data = await resp.json();
                status.className = "status-msg";
                status.textContent = "";

                if (!data.networks || data.networks.length === 0) {
                    status.className = "status-msg error";
                    status.textContent = "No networks found. Try again or move closer to your router.";
                    btn.disabled = false;
                    btn.innerHTML = '<span class="material-icons">wifi_find</span> Scan for Networks';
                    return;
                }

                renderNetworkList(data.networks);
            } catch (e) {
                status.className = "status-msg error";
                status.textContent = "Scan failed — is the backend running?";
            }

            btn.disabled = false;
            btn.innerHTML = '<span class="material-icons">wifi_find</span> Scan Again';
        }

        function renderNetworkList(networks) {
            var list = document.getElementById("network-list");
            list.innerHTML = "";

            networks.forEach(function(n) {
                var item = document.createElement("div");
                item.className = "network-item";

                // Signal bars
                var bars = "";
                var level = Math.min(4, Math.ceil(n.signal / 25));
                if (n.signal <= 0) level = 1;
                for (var i = 0; i < 4; i++) {
                    bars += '<div class="signal-bar signal-' + (i+1) + '"' +
                            (i >= level ? ' style="opacity:0.3"' : '') + '></div>';
                }

                var hasLock = n.security && n.security !== "--";
                var lockIcon = hasLock ? ' 🔒' : '';

                item.innerHTML =
                    '<div class="network-signal">' + bars + '</div>' +
                    '<span class="network-name">' + escapeHTML(n.ssid) + '</span>' +
                    '<span class="network-lock">' + (hasLock ? '🔒' : '') + '</span>';

                item.addEventListener("click", function() {
                    selectNetwork(n.ssid, n.security, item);
                });

                list.appendChild(item);
            });
        }

        function selectNetwork(ssid, security, item) {
            selectedSSID = ssid;
            selectedSecurity = security;

            // Highlight selection
            document.querySelectorAll(".network-item").forEach(function(el) {
                el.classList.remove("selected");
            });
            item.classList.add("selected");

            // Show password step
            var needsPassword = security && security !== "--";
            document.getElementById("connect-title").textContent =
                "Connect to " + ssid;
            document.getElementById("password-input").value = "";
            document.getElementById("password-input").style.display = needsPassword ? "" : "none";
            document.querySelector("#step-connect label").style.display = needsPassword ? "" : "none";
            document.getElementById("connect-status").className = "status-msg";
            document.getElementById("step-scan").style.display = "none";
            document.getElementById("step-connect").style.display = "";
            if (needsPassword) {
                document.getElementById("password-input").focus();
            } else {
                doConnect(); // Open network — connect immediately
            }
        }

        function goBack() {
            document.getElementById("step-connect").style.display = "none";
            document.getElementById("step-scan").style.display = "";
        }

        async function doConnect() {
            var btn = document.getElementById("btn-connect");
            var status = document.getElementById("connect-status");
            var password = document.getElementById("password-input").value;

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Connecting…';
            status.className = "status-msg loading";
            status.textContent = "Connecting to " + selectedSSID + "…";

            try {
                var resp = await fetch("/api/network/connect", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ ssid: selectedSSID, password: password })
                });
                var data = await resp.json();

                if (data.status === "ok") {
                    status.className = "status-msg success";
                    status.textContent = data.message;
                    showDone();
                } else {
                    status.className = "status-msg error";
                    status.textContent = data.message || "Connection failed";
                    btn.disabled = false;
                    btn.textContent = "Try Again";
                }
            } catch (e) {
                status.className = "status-msg error";
                status.textContent = "Connection failed — please try again";
                btn.disabled = false;
                btn.textContent = "Try Again";
            }
        }

        function showDone() {
            document.getElementById("step-connect").style.display = "none";
            document.getElementById("step-done").style.display = "";

            // Try to show the actual IP
            fetch("/api/network/status")
                .then(function(r) { return r.json(); })
                .then(function(s) {
                    if (s.ip) {
                        document.getElementById("done-ip").textContent =
                            "http://" + s.ip;
                    }
                })
                .catch(function() {});
        }

        function escapeHTML(str) {
            var div = document.createElement("div");
            div.appendChild(document.createTextNode(str));
            return div.innerHTML;
        }
    </script>
</body>
</html>
